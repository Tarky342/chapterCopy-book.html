<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab | 第6章</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="shell">
    <!-- タブとパネルは aria-controls / id で1対1に結びます -->
    <nav class="tabs" role="tablist" aria-label="新しいタブのメニュー">
      <button id="tab-search" type="button" class="filetab"
        role="tab" aria-selected="true" aria-controls="panel-search" tabindex="0">1 検索</button>
      <button id="tab-news" type="button" class="filetab"
        role="tab" aria-selected="false" aria-controls="panel-news" tabindex="-1">2 ニュース</button>
    </nav>

    <main class="container">
      <h1>New Tab</h1>
      <p class="subtitle">Alt + 1 / 2：タブ切り替え、Alt + D または /：検索欄へ（ブラウザの優先動作に注意）</p>

      <section id="panel-search" class="panel" role="tabpanel" aria-labelledby="tab-search">
        <!-- 検索はJavaScriptなしでもフォームのGET送信で動作します -->
        <form class="search-form" action="https://www.google.com/search" method="get" role="search">
          <label class="sr-only" for="search-input">検索キーワード</label>
          <input class="search-input" id="search-input" name="q" type="search"
            placeholder="Googleで検索" autocomplete="off" enterkeyhint="search" required>
          <button class="search-button" type="submit">検索</button>
        </form>
      </section>

      <section id="panel-news" class="panel" role="tabpanel" aria-labelledby="tab-news" hidden>
        <div class="news-card">
          <div class="news-heading">
            <h2 id="news-title">ニュース</h2>

          </div>
          <p id="news-genre" class="news-genre">ニュースタブを開くと、ニュースを取得します。</p>
          <div id="news" aria-live="polite"></div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
