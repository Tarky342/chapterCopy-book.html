<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="title desc">
  <title id="title">図 V-01-001　検索とニュースの画面構成を比較する</title>
  <desc id="desc">左の案Aは検索フォームの下にニュースを同時表示する。右の案Bは検索とニュースをタブで切り替え、最初は検索が選択中。右下にニュースを選択したときの別状態を示す。</desc>
  <defs>
    <style>
      .jp {font-family:'Noto Sans CJK JP','Noto Sans JP',sans-serif;fill:#292a2d}
      .small {font-size:17px}
      .mid {font-size:21px}
      .sub {font-size:18px;fill:#5f6264}
      .head {font-size:28px;font-weight:700}
      .label {font-size:23px;font-weight:700}
      .soft {fill:#f5f5f1;stroke:#bcc1bd;stroke-width:2}
      .stroke {stroke:#b9c0bc;stroke-width:2}
    </style>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#212b24" flood-opacity=".08"/>
    </filter>
  </defs>
  <rect width="1240" height="760" fill="#f7f5ef"/>
  <text x="58" y="56" class="jp head">画面構成を比べる</text>
  <text x="58" y="91" class="jp sub">同じ機能でも、置き方によって操作の流れが変わります。</text>

  <!-- left: always visible vertical layout -->
  <rect x="50" y="126" width="552" height="579" rx="18" fill="#fff" stroke="#d7d9d3" stroke-width="2" filter="url(#shadow)"/>
  <rect x="51" y="126" width="550" height="69" rx="17" fill="#e6efea"/>
  <rect x="51" y="174" width="550" height="22" fill="#e6efea"/>
  <text x="78" y="169" class="jp label">案A　上下に並べる</text>
  <rect x="80" y="219" width="490" height="450" rx="14" fill="#fbfcfb" stroke="#bfcac3" stroke-width="2"/>
  <text x="105" y="260" class="jp mid" font-weight="700">New Tab</text>
  <text x="105" y="302" class="jp small" font-weight="700">検索</text>
  <rect x="105" y="318" width="315" height="51" rx="8" class="soft"/>
  <text x="120" y="350" class="jp small" fill="#7b827c">キーワードを入力</text>
  <rect x="433" y="318" width="108" height="51" rx="8" fill="#dcebe2" stroke="#8da99a" stroke-width="2"/>
  <text x="464" y="350" class="jp small" font-weight="700">検索</text>
  <line x1="105" y1="397" x2="541" y2="397" class="stroke"/>
  <text x="105" y="438" class="jp small" font-weight="700">ニュース</text>
  <g>
    <rect x="105" y="458" width="90" height="61" rx="7" fill="#e3e8e4"/>
    <rect x="209" y="465" width="302" height="13" rx="5" fill="#a4afa8"/>
    <rect x="209" y="490" width="270" height="10" rx="5" fill="#d7ded8"/>
    <rect x="105" y="530" width="90" height="61" rx="7" fill="#e3e8e4"/>
    <rect x="209" y="537" width="277" height="13" rx="5" fill="#a4afa8"/>
    <rect x="209" y="561" width="304" height="10" rx="5" fill="#d7ded8"/>
    <rect x="105" y="602" width="90" height="44" rx="7" fill="#e3e8e4"/>
    <rect x="209" y="608" width="302" height="13" rx="5" fill="#a4afa8"/>
    <rect x="209" y="633" width="270" height="10" rx="5" fill="#d7ded8"/>
  </g>
  <text x="326" y="692" text-anchor="middle" class="jp small" fill="#606763">検索とニュースが同時に見える</text>

  <!-- right: tab layout -->
  <rect x="638" y="126" width="552" height="579" rx="18" fill="#fff" stroke="#d7d9d3" stroke-width="2" filter="url(#shadow)"/>
  <rect x="639" y="126" width="550" height="69" rx="17" fill="#e6efea"/>
  <rect x="639" y="174" width="550" height="22" fill="#e6efea"/>
  <text x="666" y="169" class="jp label">案B　タブで切り替える</text>
  <text x="665" y="220" class="jp sub">最初の状態：検索を表示</text>
  <rect x="666" y="236" width="493" height="181" rx="13" fill="#fbfcfb" stroke="#bfcac3" stroke-width="2"/>
  <rect x="686" y="256" width="94" height="37" rx="8" fill="#cce1d3" stroke="#8ea998" stroke-width="2"/>
  <text x="704" y="281" class="jp small" font-weight="700">検索</text>
  <rect x="784" y="256" width="106" height="37" rx="8" fill="#f1f2f0" stroke="#ccd1cc" stroke-width="2"/>
  <text x="807" y="281" class="jp small">ニュース</text>
  <text x="688" y="329" class="jp small" font-weight="700">New Tab</text>
  <rect x="687" y="346" width="330" height="47" rx="7" class="soft"/>
  <text x="701" y="375" class="jp small" fill="#788079">キーワードを入力</text>
  <rect x="1029" y="346" width="103" height="47" rx="7" fill="#dcebe2" stroke="#8da99a" stroke-width="2"/>
  <text x="1057" y="375" class="jp small" font-weight="700">検索</text>

  <path d="M910 425 v35" fill="none" stroke="#6c9781" stroke-width="3" stroke-linecap="round"/>
  <path d="M900 450 l10 12 10 -12" fill="none" stroke="#6c9781" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="934" y="449" class="jp small" fill="#527463">ニュースタブを選ぶ</text>
  <text x="665" y="494" class="jp sub">切り替え後：ニュースを表示</text>
  <rect x="666" y="506" width="493" height="174" rx="13" fill="#fbfcfb" stroke="#bfcac3" stroke-width="2"/>
  <rect x="686" y="525" width="94" height="37" rx="8" fill="#f1f2f0" stroke="#ccd1cc" stroke-width="2"/>
  <text x="704" y="550" class="jp small">検索</text>
  <rect x="784" y="525" width="106" height="37" rx="8" fill="#cce1d3" stroke="#8ea998" stroke-width="2"/>
  <text x="806" y="550" class="jp small" font-weight="700">ニュース</text>
  <rect x="689" y="579" width="72" height="52" rx="6" fill="#e3e8e4"/>
  <rect x="774" y="584" width="312" height="13" rx="5" fill="#a4afa8"/>
  <rect x="774" y="607" width="260" height="10" rx="5" fill="#d7ded8"/>
  <rect x="689" y="643" width="72" height="20" rx="6" fill="#e3e8e4"/>
  <rect x="774" y="646" width="305" height="11" rx="5" fill="#a4afa8"/>
  <text x="914" y="692" text-anchor="middle" class="jp small" fill="#606763">選んだ側の内容だけが見える</text>
</svg>
