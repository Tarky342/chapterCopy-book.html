<svg xmlns="http://www.w3.org/2000/svg" width="640" height="800" viewBox="0 0 640 800" role="img" aria-labelledby="title desc">
  <title id="title">V-07-001 症状から確認先を選ぶデバッグ手順</title>
  <desc id="desc">症状の再現、仮説、確認先の選択、修正、再検証を循環させ、タブ構造は自動テストまたはElements、構文はConsole、通信はNetwork、キャッシュはApplicationで確認する手順図。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#334155" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="looparrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#475569" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;fill:#182431}
      .heading{font-size:21px;font-weight:750;letter-spacing:.02em}
      .small{font-size:13px;fill:#415064}
      .num{font-size:17px;font-weight:750;fill:#fff;text-anchor:middle;dominant-baseline:middle}
      .box{fill:#fff;stroke:#334155;stroke-width:1.8}
      .choice{fill:#f8fafc;stroke:#546478;stroke-width:1.4}
      .tool{font-size:16px;font-weight:700}
      .topic{font-size:13px;fill:#334155}
      .mainline{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#arrow)}
      .branch{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:4 4}
      .loop{fill:none;stroke:#475569;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#looparrow)}
    </style>
  </defs>
  <rect width="640" height="800" fill="#fff"/>
  <text x="320" y="31" font-size="19" font-weight="750" text-anchor="middle">症状から確認先を選ぶ</text>
  <!-- 再現、仮説、確認 -->
  <rect class="box" x="125" y="50" width="430" height="62" rx="12"/>
  <circle cx="158" cy="81" r="19" fill="#334155"/><text class="num" x="158" y="82">1</text>
  <text class="heading" x="194" y="78">症状を再現</text><text class="small" x="194" y="98">何をすると、どう動かない？</text>
  <path class="mainline" d="M340 112 V134"/>
  <rect class="box" x="125" y="139" width="430" height="62" rx="12"/>
  <circle cx="158" cy="170" r="19" fill="#334155"/><text class="num" x="158" y="171">2</text>
  <text class="heading" x="194" y="167">仮説を立てる</text><text class="small" x="194" y="187">原因の候補を考える（まだ確定しない）</text>
  <path class="mainline" d="M340 201 V223"/>
  <rect class="box" x="125" y="228" width="430" height="62" rx="12"/>
  <circle cx="158" cy="259" r="19" fill="#334155"/><text class="num" x="158" y="260">3</text>
  <text class="heading" x="194" y="256">最小限の確認</text><text class="small" x="194" y="276">仮説に合う確認先を一つ選ぶ</text>
  <!-- 四つの確認先：破線の枝で主フローと区別 -->
  <path class="branch" d="M340 290 V311 H174 V329"/>
  <path class="branch" d="M340 311 H466 V329"/>
  <rect class="choice" x="91" y="333" width="222" height="73" rx="9"/>
  <text class="tool" x="105" y="355">自動テスト / Elements</text>
  <text class="topic" x="105" y="378">タブとパネルの対応</text>
  <text class="small" x="105" y="394">id と aria-controls</text>
  <rect class="choice" x="327" y="333" width="222" height="73" rx="9"/>
  <text class="tool" x="341" y="355">Console</text>
  <text class="topic" x="341" y="378">構文エラー</text>
  <text class="small" x="341" y="394">SyntaxError の有無</text>
  <path class="branch" d="M320 311 V418 H202 V423 M320 418 H438 V423"/>
  <rect class="choice" x="91" y="427" width="222" height="73" rx="9"/>
  <text class="tool" x="105" y="449">Network</text>
  <text class="topic" x="105" y="472">/api/news の</text>
  <text class="small" x="105" y="488">HTTP ステータス</text>
  <rect class="choice" x="327" y="427" width="222" height="73" rx="9"/>
  <text class="tool" x="341" y="449">Application</text>
  <text class="topic" x="341" y="472">保存データ・キャッシュ</text>
  <text class="small" x="341" y="488">Local Storage を確認</text>
  
  <text class="small" x="320" y="523" text-anchor="middle">確認結果をもとに、修正する箇所を絞る</text>
  <path class="mainline" d="M340 531 V544"/>
  <rect class="box" x="125" y="549" width="430" height="62" rx="12"/>
  <circle cx="158" cy="580" r="19" fill="#334155"/><text class="num" x="158" y="581">4</text>
  <text class="heading" x="194" y="577">修正</text><text class="small" x="194" y="597">確認できた原因に合わせて最小限に直す</text>
  <path class="mainline" d="M340 611 V633"/>
  <rect class="box" x="125" y="638" width="430" height="62" rx="12"/>
  <circle cx="158" cy="669" r="19" fill="#334155"/><text class="num" x="158" y="670">5</text>
  <text class="heading" x="194" y="666">同じ手順で再検証</text><text class="small" x="194" y="686">再現条件・テスト・確認先で確かめる</text>
  <!-- 異なる線種で、再検証から再現への循環を表す -->
  <path class="loop" d="M125 669 H47 V81 H119"/>
  <rect x="25" y="303" width="44" height="133" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
  <text x="47" y="324" font-size="12" text-anchor="middle" font-weight="700">繰</text>
  <text x="47" y="344" font-size="12" text-anchor="middle" font-weight="700">り</text>
  <text x="47" y="364" font-size="12" text-anchor="middle" font-weight="700">返</text>
  <text x="47" y="384" font-size="12" text-anchor="middle" font-weight="700">し</text>
  <text x="47" y="413" font-size="10" text-anchor="middle">⇧</text>
  <rect x="60" y="725" width="520" height="49" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="320" y="746" text-anchor="middle" font-size="14" font-weight="700">注意：テスト成功だけでは</text>
  <text x="320" y="765" text-anchor="middle" font-size="14">見やすさ・実通信まで保証しない</text>
</svg>
