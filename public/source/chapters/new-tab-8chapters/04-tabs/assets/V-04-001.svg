<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">クリックで表示するパネルが切り替わる対応図</title>
  <desc id="diagram-desc">クリック前は検索パネルが表示されニュースパネルが非表示。中央のニュースタブをクリックすると、クリック後はニュースパネルが表示され検索パネルが非表示になる。ニュースタブのaria-controlsはpanel-newsを指し、ニュースパネルのidに対応する。破線の枠は非表示のパネルの位置を説明用に示したもの。</desc>
  <style>
    text { font-family: "Noto Sans CJK JP", "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; fill: #172636; }
    .heading { font-size: 33px; font-weight: 700; }
    .tab { font-size: 25px; font-weight: 700; }
    .panel { font-size: 27px; font-weight: 700; }
    .state { font-size: 24px; font-weight: 700; }
    .small { font-size: 22px; }
    .code { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 23px; }
    .screen { fill: #fff; stroke: #778595; stroke-width: 2.5; }
    .tab-on { fill: #deecf4; stroke: #20516d; stroke-width: 2.8; }
    .tab-off { fill: #fff; stroke: #9aa8b6; stroke-width: 2; }
    .panel-on { fill: #f3f8fb; stroke: #20516d; stroke-width: 3; }
    .panel-off { fill: #fff; stroke: #8795a4; stroke-width: 2.5; stroke-dasharray: 9 7; }
    .subtle { fill: #526272; }
  </style>
  <rect width="1280" height="720" fill="#fff"/>

  <text x="50" y="70" class="heading">クリック前</text>
  <text x="778" y="70" class="heading">クリック後</text>

  <!-- Both views diagram the same existing pair of tabs and panels. -->
  <rect x="40" y="96" width="480" height="422" rx="17" class="screen"/>
  <rect x="760" y="96" width="480" height="422" rx="17" class="screen"/>

  <!-- Before: search selected. -->
  <rect x="62" y="119" width="211" height="60" rx="9" class="tab-on"/>
  <text x="167" y="159" text-anchor="middle" class="tab">1 検索</text>
  <rect x="283" y="119" width="211" height="60" rx="9" class="tab-off"/>
  <text x="388" y="159" text-anchor="middle" class="tab">2 ニュース</text>
  <rect x="62" y="196" width="432" height="128" rx="10" class="panel-on"/>
  <text x="83" y="240" class="panel">panel-search</text>
  <text x="83" y="292" class="state">表示</text>
  <rect x="62" y="343" width="432" height="150" rx="10" class="panel-off"/>
  <text x="83" y="386" class="panel">panel-news</text>
  <text x="83" y="433" class="state">非表示</text>
  <text x="83" y="470" class="small subtle">hidden あり</text>

  <!-- One interaction; the arrow does not represent a new element. -->
  <text x="640" y="213" text-anchor="middle" class="state">ニュースを</text>
  <text x="640" y="248" text-anchor="middle" class="state">クリック</text>
  <path d="M 550 308 H 717" fill="none" stroke="#20516d" stroke-width="6" stroke-linecap="round"/>
  <path d="M 699 292 L 719 308 L 699 324" fill="none" stroke="#20516d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="640" y="365" text-anchor="middle" class="small">表示 / 非表示</text>
  <text x="640" y="398" text-anchor="middle" class="small subtle">を切り替える</text>

  <!-- After: news selected, not newly created. -->
  <rect x="782" y="119" width="211" height="60" rx="9" class="tab-off"/>
  <text x="887" y="159" text-anchor="middle" class="tab">1 検索</text>
  <rect x="1003" y="119" width="211" height="60" rx="9" class="tab-on"/>
  <text x="1108" y="159" text-anchor="middle" class="tab">2 ニュース</text>
  <rect x="782" y="196" width="432" height="128" rx="10" class="panel-off"/>
  <text x="803" y="240" class="panel">panel-search</text>
  <text x="803" y="292" class="state">非表示 · hidden あり</text>
  <rect x="782" y="343" width="432" height="150" rx="10" class="panel-on"/>
  <text x="803" y="386" class="panel">panel-news</text>
  <text x="803" y="433" class="state">表示</text>
  <text x="803" y="470" class="small subtle">hidden なし</text>

  <!-- Mapping, shown once: identifies the target; does not itself perform switching. -->
  <text x="54" y="568" class="small">タブとパネルの対応（切り替え処理ではない）</text>
  <rect x="50" y="584" width="1180" height="55" rx="9" fill="#f4f6f8" stroke="#c5ced6" stroke-width="2"/>
  <text x="76" y="619" class="code">aria-controls="panel-news"</text>
  <path d="M 522 611 H 630" stroke="#20516d" stroke-width="3"/>
  <path d="M 618 602 L 631 611 L 618 620" fill="none" stroke="#20516d" stroke-width="3"/>
  <text x="661" y="619" class="code">id="panel-news"</text>
  <text x="52" y="671" class="small">hidden は、そのパネルを表示するかどうかを表す。</text>
  <text x="1228" y="700" text-anchor="end" font-size="18" class="subtle">本文の実装に基づく簡略図</text>
</svg>
