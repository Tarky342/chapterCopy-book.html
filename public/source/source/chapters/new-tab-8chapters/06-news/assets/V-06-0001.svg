<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">図 V-06-001 ニュース取得の通信経路</title>
  <desc id="desc">左からブラウザ、ローカルNode.jsサーバー、GNews API。ブラウザは自分のサーバーにニュースを依頼し、サーバーだけが秘密のAPIキーを使ってGNewsへ問い合わせる。GNewsから記事データがサーバーに返り、整形されたJSONがブラウザへ届いて画面に表示される。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#466B62" stroke-width="1.8" stroke-linecap="round"/></marker>
    <marker id="arrowgray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#8D7D5F" stroke-width="1.8" stroke-linecap="round"/></marker>
  </defs>
  <rect x="0" y="0" width="1100" height="500" rx="20" fill="#F9F8F5"/>
  <text x="40" y="49" font-family="Noto Sans CJK JP, sans-serif" font-size="24" font-weight="700" fill="#243B35">ニュースタブを押したあと、データはどこを通る？</text>
  <rect x="34" y="91" width="292" height="308" rx="16" fill="#FFF" stroke="#A8B8B2" stroke-width="2"/>
  <rect x="34" y="91" width="292" height="60" rx="16" fill="#E2F0E8"/>
  <rect x="34" y="135" width="292" height="16" fill="#E2F0E8"/>
  <text x="180" y="130" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="21" font-weight="700" fill="#24483C">① ブラウザ</text>
  <text x="57" y="186" font-family="Noto Sans CJK JP, sans-serif" font-size="17" fill="#263C36">ニュースタブをクリック</text>
  <text x="57" y="221" font-family="monospace" font-size="15.5" fill="#3F5F55">fetch('/api/news?...')</text>
  <line x1="57" x2="303" y1="249" y2="249" stroke="#D8DFDA"/>
  <text x="57" y="284" font-family="Noto Sans CJK JP, sans-serif" font-size="17" fill="#263C36">JSONを受け取る</text>
  <text x="57" y="316" font-family="monospace" font-size="15.5" fill="#3F5F55">displayNews(articles)</text>
  <text x="57" y="351" font-family="Noto Sans CJK JP, sans-serif" font-size="16" fill="#50635D">記事カードを画面に表示</text>

  <rect x="401" y="91" width="298" height="308" rx="16" fill="#FFF" stroke="#A8B8B2" stroke-width="2"/>
  <rect x="401" y="91" width="298" height="60" rx="16" fill="#DEE8F4"/>
  <rect x="401" y="135" width="298" height="16" fill="#DEE8F4"/>
  <text x="550" y="130" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="21" font-weight="700" fill="#24405F">② Node.jsサーバー</text>
  <text x="423" y="186" font-family="monospace" font-size="16" fill="#334B67">GET /api/news</text>
  <text x="423" y="215" font-family="Noto Sans CJK JP, sans-serif" font-size="17" fill="#263C36">検索語のチェック</text>
  <rect x="423" y="237" width="252" height="47" rx="8" fill="#F5EDE1" stroke="#D6C3A6"/>
  <text x="549" y="256" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="15" font-weight="700" fill="#77532C">秘密のAPIキー</text>
  <text x="549" y="275" text-anchor="middle" font-family="monospace" font-size="13.5" fill="#77532C">process.env.GNEWS_API_KEY</text>
  <text x="423" y="320" font-family="Noto Sans CJK JP, sans-serif" font-size="16.5" fill="#263C36">記事を選んでJSONで返す</text>
  <text x="423" y="355" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#576862">キーは応答に含めない</text>

  <rect x="774" y="91" width="292" height="308" rx="16" fill="#FFF" stroke="#A8B8B2" stroke-width="2"/>
  <rect x="774" y="91" width="292" height="60" rx="16" fill="#EFEAE2"/>
  <rect x="774" y="135" width="292" height="16" fill="#EFEAE2"/>
  <text x="920" y="130" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="21" font-weight="700" fill="#5D4A32">③ GNews API</text>
  <text x="795" y="186" font-family="monospace" font-size="15.5" fill="#6D583B">/api/v4/search</text>
  <text x="795" y="220" font-family="Noto Sans CJK JP, sans-serif" font-size="17" fill="#263C36">記事を検索する</text>
  <text x="795" y="254" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#6D583B">X-Api-Key を確認</text>
  <line x1="795" x2="1042" y1="282" y2="282" stroke="#E0DBD3"/>
  <text x="795" y="319" font-family="Noto Sans CJK JP, sans-serif" font-size="17" fill="#263C36">記事データを返す</text>
  <text x="795" y="351" font-family="monospace" font-size="15" fill="#6D583B">articles: [...]</text>

  <path d="M330 187 H394" fill="none" stroke="#466B62" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M703 187 H767" fill="none" stroke="#466B62" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M769 319 H706" fill="none" stroke="#8D7D5F" stroke-width="3" marker-end="url(#arrowgray)"/>
  <path d="M396 319 H332" fill="none" stroke="#8D7D5F" stroke-width="3" marker-end="url(#arrowgray)"/>
  <text x="365" y="168" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#466B62">依頼</text>
  <text x="738" y="168" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#466B62">依頼</text>
  <text x="738" y="343" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#8D7D5F">応答</text>
  <text x="365" y="343" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#8D7D5F">応答</text>

  <rect x="34" y="423" width="1032" height="47" rx="10" fill="#F1ECE2"/>
  <text x="550" y="453" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="18" font-weight="700" fill="#654D2A">APIキーはサーバーに置き、ブラウザへ配信しない</text>
</svg>
