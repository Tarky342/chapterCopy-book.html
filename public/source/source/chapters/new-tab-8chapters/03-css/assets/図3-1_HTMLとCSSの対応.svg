<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" role="img" aria-label="HTML構造とCSSセレクターの対応を表す図">
<style>text{font-family:"Noto Sans CJK JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#242424}.title{font-size:25px;font-weight:bold}.label{font-size:20px;font-weight:bold}.small{font-size:17px}.note{font-size:15px;fill:#57534f}.html{fill:#f3f2ee;stroke:#8c877e;stroke-width:2}.css{fill:#dff0e4;stroke:#478866;stroke-width:2}.line{stroke:#6b7b72;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6b7b72"/></marker></defs>
<text x="25" y="42" class="title">HTML側：要素とclass</text><text x="700" y="42" class="title">CSS側：見た目の指定</text>
<rect x="20" y="62" width="440" height="340" rx="15" class="html"/>
<rect x="46" y="86" width="388" height="52" rx="8" fill="#ffffff" stroke="#ccc"/><text x="66" y="119" class="label">div.shell</text>
<rect x="69" y="160" width="343" height="76" rx="8" fill="#ffffff" stroke="#ccc"/><text x="88" y="191" class="label">nav.tabs</text><text x="101" y="219" class="small">button.filetab × 2</text>
<rect x="69" y="260" width="343" height="114" rx="8" fill="#ffffff" stroke="#ccc"/><text x="88" y="291" class="label">main.container</text><text x="100" y="323" class="small">form.search-form</text><text x="100" y="349" class="small">input.search-input / button.search-button</text>
<rect x="700" y="85" width="370" height="54" rx="8" class="css"/><text x="721" y="118" class="label">.shell  最大700px・中央配置</text>
<rect x="700" y="165" width="370" height="74" rx="8" class="css"/><text x="721" y="193" class="label">.tabs / .filetab</text><text x="721" y="222" class="small">タブの横並び・外観</text>
<rect x="700" y="264" width="370" height="112" rx="8" class="css"/><text x="721" y="293" class="label">.container / .search-form</text><text x="721" y="322" class="small">余白・横並び</text><text x="721" y="349" class="small">.search-input / .search-button</text>
