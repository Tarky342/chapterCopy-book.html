<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="770" viewBox="0 0 1360 770" role="img" aria-labelledby="title desc">
<title id="title">図 V-08-001 検証サイクル</title>
<desc id="desc">目的と予測、変更、検証、記録、次の改善という五つの段階を循環し、検証では自動テストとブラウザでの実測を組み合わせる。</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#477C74"/></marker>
  <style>text{font-family:'Noto Sans CJK JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;fill:#24383A} .kicker{font-size:20px;letter-spacing:2px;fill:#497A73;font-weight:bold} .heading{font-size:35px;font-weight:bold} .title{font-size:22px;font-weight:bold} .body{font-size:16px;fill:#53686A} .small{font-size:18px;font-weight:bold} .number{font-size:18px;font-weight:bold;fill:#417F74} .line{fill:none;stroke:#477C74;stroke-width:4;marker-end:url(#arrow)} </style>
</defs>
<rect width="1360" height="770" rx="28" fill="#FAFAF7"/>
<text x="64" y="67" class="kicker">V-08-001  ·  CHAPTER 08</text>
<text x="64" y="122" class="heading">作ったあとも続く、検証と改善のサイクル</text>
<text x="64" y="161" class="body">機能を一度動かすだけでなく、予測と実測を比べて次の判断につなげます。</text>

<g transform="translate(52,225)">
  <rect width="220" height="150" rx="17" fill="#E9F2EE" stroke="#B5D2C9" stroke-width="2"/>
  <text x="18" y="35" class="number">01</text><text x="18" y="78" class="title">目的・予測</text>
  <text x="18" y="111" class="body">何がどう変わるか</text><text x="18" y="136" class="body">先に言葉にする</text>
</g>
<g transform="translate(310,225)">
  <rect width="220" height="150" rx="17" fill="#F4EEE0" stroke="#DACAA2" stroke-width="2"/>
  <text x="18" y="35" class="number">02</text><text x="18" y="78" class="title">一か所を変更</text>
  <text x="18" y="111" class="body">変更点を小さくし</text><text x="18" y="136" class="body">比較しやすくする</text>
</g>
<g transform="translate(568,225)">
  <rect width="220" height="150" rx="17" fill="#E6F0F5" stroke="#AFCBD8" stroke-width="2"/>
  <text x="18" y="35" class="number">03</text><text x="18" y="78" class="title">実行・検証</text>
  <text x="18" y="111" class="body">テストと画面から</text><text x="18" y="136" class="body">事実を集める</text>
</g>
<g transform="translate(826,225)">
  <rect width="220" height="150" rx="17" fill="#F0EDF5" stroke="#CBC0D9" stroke-width="2"/>
  <text x="18" y="35" class="number">04</text><text x="18" y="78" class="title">記録・判断</text>
  <text x="18" y="111" class="body">実測と予測の</text><text x="18" y="136" class="body">違いを説明する</text>
</g>
<g transform="translate(1084,225)">
  <rect width="220" height="150" rx="17" fill="#E9F2EE" stroke="#B5D2C9" stroke-width="2"/>
  <text x="18" y="35" class="number">05</text><text x="18" y="78" class="title">次の改善</text>
  <text x="18" y="111" class="body">修正・復元・</text><text x="18" y="136" class="body">新しい仮説へ</text>
</g>
<path class="line" d="M275 300 H300"/><path class="line" d="M533 300 H558"/><path class="line" d="M791 300 H816"/><path class="line" d="M1049 300 H1074"/>
<path class="line" d="M1194 384 V430 Q1194 453 1171 453 H152 Q111 453 111 417 V385"/>
<rect x="508" y="435" width="344" height="38" rx="19" fill="#FAFAF7"/>
<text x="680" y="462" text-anchor="middle" class="small" fill="#477C74">結果を次の予測に戻す</text>
<path d="M678 377 V524" fill="none" stroke="#93A8AD" stroke-width="3" stroke-dasharray="8 8"/>
<text x="680" y="552" text-anchor="middle" class="small">検証では二つの根拠を組み合わせる</text>
<g>
  <rect x="235" y="577" width="428" height="115" rx="16" fill="#FFFFFF" stroke="#CEDDDF" stroke-width="2"/>
  <rect x="256" y="597" width="8" height="74" rx="4" fill="#4A8379"/>
  <text x="284" y="615" class="title">自動テスト</text>
  <text x="284" y="646" class="body">HTMLの対応、構文、HTTP応答など</text>
  <text x="284" y="673" class="body">決めた条件を繰り返し確認</text>
</g>
<g>
  <rect x="696" y="577" width="428" height="115" rx="16" fill="#FFFFFF" stroke="#CEDDDF" stroke-width="2"/>
  <rect x="717" y="597" width="8" height="74" rx="4" fill="#7599B0"/>
  <text x="745" y="615" class="title">ブラウザでの実測</text>
  <text x="745" y="646" class="body">画面、フォーカス、Networkなど</text>
  <text x="745" y="673" class="body">人が使った結果と状態を確認</text>
</g>
<text x="680" y="736" text-anchor="middle" class="body">未実施の項目は未実施と記録し、確認できたことだけを根拠に判断する</text>
</svg>
