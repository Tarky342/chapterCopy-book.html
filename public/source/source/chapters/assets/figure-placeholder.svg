<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">図の仮置き</title>
  <desc id="desc">印刷用の図版プレースホルダー。点線の枠の中に画像アイコンと「ここに図を挿入」の文字を配置。</desc>
  <rect x="2" y="2" width="956" height="536" rx="12" fill="#FAFAFA" stroke="#8A929A" stroke-width="3" stroke-dasharray="12 10"/>
  <g transform="translate(432 144)" fill="none" stroke="#6B7785" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="96" height="80" rx="6"/>
    <circle cx="28" cy="25" r="8" fill="#6B7785" stroke="none"/>
    <path d="M10 68 37 43 54 58 70 38 86 57"/>
  </g>
  <text x="480" y="284" text-anchor="middle" fill="#333B43" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="32" font-weight="600">ここに図を挿入</text>
  <text x="480" y="328" text-anchor="middle" fill="#6B7785" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="19">図版プレースホルダー</text>
</svg>
